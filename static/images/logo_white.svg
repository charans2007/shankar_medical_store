<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56">
  <defs>
    <linearGradient id="medGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadowDark" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Medical Cross Shield Icon -->
  <g filter="url(#softShadowDark)">
    <rect x="2" y="2" width="52" height="52" rx="14" fill="url(#medGradDark)" />
    <!-- White Medical Cross -->
    <path d="M28 14 V40 M15 27 H41" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Brand Text -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="-0.3">SHANKAR</text>
  <text x="69" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#2dd4bf" letter-spacing="2">HOMOEO STORES</text>
</svg>
