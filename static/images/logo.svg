<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 60" width="310" height="60">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Medical Cross Shield Icon -->
  <g filter="url(#softShadow)">
    <rect x="10" y="8" width="44" height="44" rx="12" fill="url(#medGrad)" />
    <!-- White Medical Cross -->
    <path d="M32 18 V42 M20 30 H44" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Brand Text -->
  <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.5">SHANKAR</text>
  <text x="67" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d9488" letter-spacing="1.5">HOMOEO STORES</text>
</svg>
