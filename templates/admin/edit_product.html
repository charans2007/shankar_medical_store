{% extends 'admin/base_admin.html' %}

{% block title %}Edit {{ product.name }}{% endblock %}

{% block content %}
<div style="margin-bottom: 2rem;">
  <a href="{{ url_for('admin.products') }}" style="font-size: 0.85rem; color: #64748b; font-weight: 600;">
    &larr; Back to Products
  </a>
  <h1 style="font-size: 1.75rem; color: #0f172a; font-weight: 800; margin-top: 0.5rem;">Edit Product: {{ product.name }}</h1>
</div>

<div class="admin-card admin-form" style="padding: 2rem;">
  <form method="POST" action="{{ url_for('admin.edit_product', product_id=product.id) }}">
    <div class="form-group">
      <label class="form-label" for="name">Product Name *</label>
      <input type="text" id="name" name="name" class="form-control" required value="{{ product.name }}">
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="category_id">Category *</label>
        <select id="category_id" name="category_id" class="form-control" required>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="availability">Availability Status *</label>
        <select id="availability" name="availability" class="form-control" required>
          <option value="In Stock" {% if product.availability == 'In Stock' %}selected{% endif %}>In Stock</option>
          <option value="Limited Stock" {% if product.availability == 'Limited Stock' %}selected{% endif %}>Limited Stock</option>
          <option value="Availability Varies" {% if product.availability == 'Availability Varies' %}selected{% endif %}>Availability Varies</option>
          <option value="Out of Stock" {% if product.availability == 'Out of Stock' %}selected{% endif %}>Out of Stock</option>
        </select>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="brand">Brand / Manufacturer</label>
        <input type="text" id="brand" name="brand" class="form-control" value="{{ product.brand or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="pack_size">Pack Size / Packaging</label>
        <input type="text" id="pack_size" name="pack_size" class="form-control" value="{{ product.pack_size or '' }}">
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="dosage_form">Dosage Form</label>
        <input type="text" id="dosage_form" name="dosage_form" class="form-control" value="{{ product.dosage_form or '' }}">
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 2rem;">
        <input type="checkbox" id="requires_prescription" name="requires_prescription" value="1" {% if product.requires_prescription %}checked{% endif %}>
        <label for="requires_prescription" style="font-weight: 600; font-size: 0.95rem; cursor: pointer;">
          Requires Doctor's Prescription (Rx)
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Description &amp; Composition</label>
      <textarea id="description" name="description" class="form-control" rows="4">{{ product.description or '' }}</textarea>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <button type="submit" class="btn btn-primary btn-lg">
        💾 Update Product
      </button>
      <a href="{{ url_for('admin.products') }}" class="btn btn-outline btn-lg">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
