{% extends 'admin/base_admin.html' %}

{% block title %}Add Product{% endblock %}

{% block content %}
<div style="margin-bottom: 2rem;">
  <a href="{{ url_for('admin.products') }}" style="font-size: 0.85rem; color: #64748b; font-weight: 600;">
    &larr; Back to Products
  </a>
  <h1 style="font-size: 1.75rem; color: #0f172a; font-weight: 800; margin-top: 0.5rem;">Add New Product</h1>
  <p style="color: #64748b; font-size: 0.95rem;">Enter product specifications for in-store availability listing.</p>
</div>

<div class="admin-card admin-form" style="padding: 2rem;">
  <form method="POST" action="{{ url_for('admin.add_product') }}">
    <div class="form-group">
      <label class="form-label" for="name">Product Name *</label>
      <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Paracetamol 650mg, Digital BP Monitor" value="{{ form_data.name if form_data else '' }}">
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="category_id">Category *</label>
        <select id="category_id" name="category_id" class="form-control" required>
          <option value="">Select Category</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if form_data and form_data.category_id|int == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="availability">Availability Status *</label>
        <select id="availability" name="availability" class="form-control" required>
          <option value="In Stock">In Stock</option>
          <option value="Limited Stock">Limited Stock</option>
          <option value="Availability Varies">Availability Varies</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="brand">Brand / Manufacturer</label>
        <input type="text" id="brand" name="brand" class="form-control" placeholder="e.g. Cipla, Abbott, Generic" value="{{ form_data.brand if form_data else '' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="pack_size">Pack Size / Packaging</label>
        <input type="text" id="pack_size" name="pack_size" class="form-control" placeholder="e.g. Strip of 10 Tablets, 100ml Bottle" value="{{ form_data.pack_size if form_data else '' }}">
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label" for="dosage_form">Dosage Form</label>
        <input type="text" id="dosage_form" name="dosage_form" class="form-control" placeholder="e.g. Tablet, Syrup, Device, Ointment" value="{{ form_data.dosage_form if form_data else '' }}">
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 2rem;">
        <input type="checkbox" id="requires_prescription" name="requires_prescription" value="1" {% if form_data and form_data.requires_prescription %}checked{% endif %}>
        <label for="requires_prescription" style="font-weight: 600; font-size: 0.95rem; cursor: pointer;">
          Requires Doctor's Prescription (Rx)
        </label>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Description &amp; Composition</label>
      <textarea id="description" name="description" class="form-control" rows="4" placeholder="Brief description of usage, strengths, or packaging details.">{{ form_data.description if form_data else '' }}</textarea>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <button type="submit" class="btn btn-primary btn-lg">
        💾 Save Product
      </button>
      <a href="{{ url_for('admin.products') }}" class="btn btn-outline btn-lg">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
