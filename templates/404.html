{% extends 'base.html' %}

{% block title %}404 Page Not Found - {{ shop.name }}{% endblock %}

{% block content %}
<div class="container section" style="text-align: center; padding: 5rem 1rem;">
  <span style="font-size: 4rem; display: block; margin-bottom: 1rem;">🔍</span>
  <h1 style="font-size: 2.5rem; color: var(--text-primary); margin-bottom: 0.5rem;">404 - Page Not Found</h1>
  <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 2rem; font-size: 1.05rem;">
    The page or product catalogue item you are looking for does not exist or has been moved.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
      🏠 Return to Home
    </a>
    <a href="{{ url_for('products.catalogue') }}" class="btn btn-outline btn-lg">
      💊 Browse Product Catalogue
    </a>
  </div>
</div>
{% endblock %}
